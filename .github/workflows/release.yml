name: Release (signed APK + AAB)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          cd app/src/main/assets/fonts
          base=https://github.com/google/fonts/raw/main/ofl
          [ -f Lato-Regular.ttf ] || curl -fsSL -o Lato-Regular.ttf "$base/lato/Lato-Regular.ttf" || true
          [ -f Lato-Bold.ttf ] || curl -fsSL -o Lato-Bold.ttf "$base/lato/Lato-Bold.ttf" || true
          [ -f NotoSerifBengali.ttf ] || curl -fsSL -o NotoSerifBengali.ttf "$base/notoserifbengali/NotoSerifBengali%5Bwdth%2Cwght%5D.ttf" || true
          ls -la
          # No silent fallback to the system font: the build stops if a font is missing or empty.
          for f in Lato-Regular.ttf Lato-Bold.ttf NotoSerifBengali.ttf; do
            [ -s "$f" ] || { echo "::error::$f is missing. Commit it to app/src/main/assets/fonts/ or fix the download."; exit 1; }
          done

      - name: Check secrets and restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!n}" ]; then echo "::error::Secret $n is missing (Settings > Secrets and variables > Actions)"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "== Release certificate (add SHA-1 and SHA-256 to Firebase) =="
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1|SHA256|Owner"

      - name: Set version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=${{ inputs.version_name }}" >> "$GITHUB_ENV"
          fi

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK is signed with the release key
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          ls -la app/build/outputs/apk/release app/build/outputs/bundle/release

      - uses: actions/upload-artifact@v4
        with:
          name: examcamp-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: examcamp-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # Needed to read crash stack traces from an obfuscated build (Play Console -> deobfuscation file).
      - uses: actions/upload-artifact@v4
        with:
          name: examcamp-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
